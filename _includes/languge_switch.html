<!-- Switch Container -->
<div class="switch-container">
  <span class="lang-label">EN</span>
  
  <!-- Switch Button -->
  <label class="switch">
    <input type="checkbox" id="langSwitch">
    <span class="slider round"></span>
  </label>
  
  <span class="lang-label">CH</span>
</div>

<script>
function updateTOC() {
  const langEn = document.getElementById('lang-en');
  const langCh = document.getElementById('lang-ch');
  const isChinese = document.getElementById('langSwitch').checked;
  const visibleSection = isChinese ? langCh : langEn;
  const hiddenSection = isChinese ? langEn : langCh;
  
  // Get all TOC links - try multiple selectors to find the TOC
  const tocLinks = document.querySelectorAll('#toc a[href^="#"], .toc a[href^="#"], nav.toc a[href^="#"], aside.toc a[href^="#"], .post-toc a[href^="#"]');
  
  tocLinks.forEach(link => {
    const href = link.getAttribute('href');
    if (!href || !href.startsWith('#')) return;
    
    const targetId = href.substring(1); // Remove the #
    
    // Find the target heading element by ID
    const targetHeading = document.getElementById(targetId);
    
    if (!targetHeading) {
      // If we can't find the heading, hide the TOC item to be safe
      const tocItem = link.closest('li') || link.parentElement;
      if (tocItem) {
        tocItem.style.display = 'none';
      }
      return;
    }
    
    // Check if the target heading is within the visible language section
    const isInVisibleSection = visibleSection && visibleSection.contains(targetHeading);
    const isInHiddenSection = hiddenSection && hiddenSection.contains(targetHeading);
    
    // Show TOC item only if heading is in visible section
    const shouldShow = isInVisibleSection && !isInHiddenSection;
    
    // Hide/show the TOC item (hide the parent li if it exists, otherwise hide the link itself)
    const tocItem = link.closest('li') || link.parentElement;
    if (tocItem) {
      tocItem.style.display = shouldShow ? '' : 'none';
    } else {
      link.style.display = shouldShow ? '' : 'none';
    }
  });
}

// Initialize TOC on page load
document.addEventListener('DOMContentLoaded', function() {
  // Wait a bit for TOC to be generated
  setTimeout(updateTOC, 100);
  
  // Update TOC when language switches
  const langSwitch = document.getElementById('langSwitch');
  if (langSwitch) {
    langSwitch.addEventListener('change', function () {
      if (this.checked === true) {
        if (document.getElementById('lang-en')) {
          document.getElementById('lang-en').style.display = "none";
        }
        if (document.getElementById('lang-ch')) {
          document.getElementById('lang-ch').style.display = "block";
        }
      } else {
        if (document.getElementById('lang-en')) {
          document.getElementById('lang-en').style.display = "block";
        }
        if (document.getElementById('lang-ch')) {
          document.getElementById('lang-ch').style.display = "none";
        }
      }
      
      // Update TOC after a short delay to ensure DOM is updated
      setTimeout(updateTOC, 50);
    });
  }
});

</script>

<!-- Styling for the switch -->
<style>
/* Parent container styling */
.switch-container {
  display: flex;
  align-items: center;
  justify-content: flex-end; /* Align the switch to the right */
  gap: 8px; /* Add space between the labels and the switch */
}

/* Language labels styling */
.lang-label {
  font-size: 16px;
  font-weight: bold;
  color: #555;
}

/* Styling for the switch */
.switch {
  position: relative;
  display: inline-block;
  width: 60px;
  height: 34px;
}
.switch input {
  display: none;
}
.slider {
  position: absolute;
  cursor: pointer;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background-color: #ccc;
  transition: 0.4s;
}
.slider:before {
  position: absolute;
  content: "";
  height: 26px;
  width: 26px;
  left: 4px;
  bottom: 4px;
  background-color: white;
  transition: 0.4s;
}
input:checked + .slider {
  background-color: #616365;
}
input:checked + .slider:before {
  transform: translateX(26px);
}

/* Rounded sliders */
.slider.round {
  border-radius: 34px;
}
.slider.round:before {
  border-radius: 50%;
}
#lang-en {
  display: block;
}
#lang-ch {
  display: none;
}


</style>
